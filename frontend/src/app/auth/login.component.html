<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted">Use your registered email and password.</p>

    @if (loginError) {
      <div class="alert" role="alert">{{ loginError }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Email
        <input type="text" formControlName="username" autocomplete="username" />
        <small class="error">{{ err('username', 'Email') }}</small>
      </label>
      <label>Password
        <input type="password" formControlName="password" autocomplete="current-password" />
        <small class="error">{{ err('password', 'Password') }}</small>
      </label>
      <div class="actions">
        <button type="submit" class="btn primary block" [disabled]="submitting">{{ submitting ? 'Signing in…' : 'Sign in' }}</button>
      </div>
    </form>

    <p class="switch">No account yet? <a routerLink="/register">Create one</a></p>
  </div>
</div>
