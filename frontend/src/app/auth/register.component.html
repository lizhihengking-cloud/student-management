<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Create account</h1>
    <p class="muted">Register as a student to browse courses and enrol.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="grid">
        <label>First name *
          <input formControlName="firstName" autocomplete="given-name" />
          <small class="error">{{ err('firstName', 'First name') }}</small>
        </label>
        <label>Last name *
          <input formControlName="lastName" autocomplete="family-name" />
          <small class="error">{{ err('lastName', 'Last name') }}</small>
        </label>
        <label class="span-2">Email *
          <input type="email" formControlName="email" autocomplete="email" />
          <small class="error">{{ err('email', 'Email') }}</small>
        </label>
        <label class="span-2">Date of birth
          <input type="date" formControlName="dateOfBirth" />
          <small class="error">{{ err('dateOfBirth', 'Date of birth') }}</small>
        </label>
        <label>Password *
          <input type="password" formControlName="password" autocomplete="new-password" />
          <small class="error">{{ err('password', 'Password') }}</small>
        </label>
        <label>Confirm password *
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
          <small class="error">{{ err('confirmPassword', 'Passwords') }}</small>
        </label>
      </div>
      <div class="actions">
        <button type="submit" class="btn primary block" [disabled]="submitting">{{ submitting ? 'Creating…' : 'Create account' }}</button>
      </div>
    </form>

    <p class="switch">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
