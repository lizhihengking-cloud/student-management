@if (confirm.state$ | async; as s) {
  <div class="backdrop" (click)="confirm.answer(false)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" (click)="$event.stopPropagation()">
      <h2 id="confirm-title">{{ s.title }}</h2>
      <p>{{ s.message }}</p>
      <div class="modal-actions">
        <button type="button" class="btn" (click)="confirm.answer(false)">{{ s.cancelText || 'Cancel' }}</button>
        <button type="button" class="btn" [class.danger]="s.danger" [class.primary]="!s.danger" (click)="confirm.answer(true)">
          {{ s.confirmText || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
