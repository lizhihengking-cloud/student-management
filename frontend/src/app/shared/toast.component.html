<div class="toast-stack" aria-live="polite">
  @for (t of notifications.toasts$ | async; track t.id) {
    <div class="toast" [class]="'toast ' + t.type" role="status">
      <span>{{ t.message }}</span>
      <button type="button" class="toast-close" aria-label="Dismiss" (click)="notifications.dismiss(t.id)">×</button>
    </div>
  }
</div>
